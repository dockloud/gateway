name: Go CI Workflow

env:
  MODULE_NAME: "gateway"
  MODULE_VER: "v1.0"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          docker build \
            --secret id=github_token,env=GH_TOKEN \
            --file Dockerfile \
            --tag ghcr.io/dockloud/${{ env.MODULE_NAME }}:${{ env.MODULE_VER }} \
            .

      - name: Push Docker image
        run: docker push ghcr.io/dockloud/${{ env.MODULE_NAME }}:${{ env.MODULE_VER }}

  #deploy: